server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location /uploads/ {
    proxy_pass http://backend:8000;
  }

  location / {
    try_files $uri /index.html;
  }
}
